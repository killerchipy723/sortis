<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sortis Motos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="img/logosolo.ico" type="image/x-icon">

    <style>
        body {
            background: linear-gradient(120deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(8px);
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-sortis {
            width: 50px; /* Ajusta el tamaño del logo */
            margin-right: 10px;
        }

        .header-container h2 {
            font-weight: bold;
            color: white;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="header-container">
            <img class="logo-sortis" src="img/logo.png" alt="Sortis Motos Logo">
            <h2>Sortis Motos</h2>
        </div>
        <form action="/login" method="POST">
            <div class="alert alert-danger" id="error-message">Usuario o contraseña incorrectos.</div>
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Usuario</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Ingrese su usuario" required>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
