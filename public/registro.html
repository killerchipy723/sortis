<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ingresos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <link rel="icon" href="img/logosolo.ico" type="image/x-icon">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }

        h1, h2 {
            color: #343a40;
        }

        .titulo {
            color: #eaecee;
        }


        .container {
            margin-top: 20px;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background-color: #007bff;
            color: white;
            border-radius: 20px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        table {
            margin-top: 20px;
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            text-align: center;
            padding: 12px;
            border: 1px solid #dee2e6;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .responsive-table th, .responsive-table td {
            padding: 8px;
            font-size: 0.8rem;
        }

        #totalRecaudacion {
            font-size: 1.2em;
            margin-top: 20px;
            font-weight: bold;
            color: #28a745;
        }

        /* Estilos para la portada dinámica */
        .hero-section {
            background: linear-gradient(to right, #007bff, #0056b3);
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .hero-section img {
            width: 200px; /* Ajusta el tamaño de la imagen a tu necesidad */
            height: auto;
            animation: fadeIn 2s ease-out;
        }

        /* Animación en la portada */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Media Queries para dispositivos móviles */
        @media (max-width: 768px) {
            .hero-section {
                padding: 40px 20px;
            }

            .hero-section img {
                width: 150px; /* Ajusta el tamaño para pantallas pequeñas */
            }

            table {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Portada dinámica con imagen -->
    <div class="hero-section">
       <h1 class="titulo" > SORTIS-MOTOS METAN</h1>
    </div>

    <!-- Contenedor principal -->
    <div class="container mt-5">
        <h2>Seleccione la Fecha a Consultar</h2>
        <form id="searchForm">
            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Consultar</button>
        </form>

        <h2 class="mt-4">Resultados de la Consulta</h2>
        <div id="results" style="display: none;">
            <table class="table table-bordered responsive-table mt-3" id="resultsTable">
                <thead>
                    <tr>
                        <th>ID Cuota</th>
                        <th>Afiliado</th>
                        <th>DNI</th>
                        <th>N° Cuota</th>
                        <th>Vencimiento</th>
                        <th>Fecha Pago</th>
                        <th>Forma Pago</th>
                        <th>Importe</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
            <h4 id="totalRecaudacion"></h4>
            <div id="totalPorForma" class="mt-3">
                <h4>Desglose por Forma de Pago:</h4>
            </div>
        </div>
    </div>

    <script>
        function formatDate(dateString) {
            const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0'); // Los meses son 0-indexados
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function formatCurrency(value) {
            return '$ ' + value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.').replace('.', ',');
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fecha = document.getElementById('fecha').value;

            const response = await fetch('/recaudacion', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ fecha }),
            });

            const data = await response.json();
            displayResults(data);
        });

        function displayResults(data) {
            const resultsBody = document.getElementById('resultsBody');
            const totalRecaudacion = document.getElementById('totalRecaudacion');
            const totalPorForma = document.getElementById('totalPorForma');

            resultsBody.innerHTML = '';
            totalPorForma.innerHTML = '';
            let total = 0;

            // Renderizar detalles de las cuotas
            data.detalles.forEach(row => {
                resultsBody.innerHTML += `
                    <tr>
                        <td>${row.idcuota}</td>
                        <td>${row.afiliado}</td>
                        <td>${row.doc}</td>
                        <td>${row.cuota}</td>
                        <td>${formatDate(row.fvenc)}</td>
                        <td>${formatDate(row.fpag)}</td>
                        <td>${row.forma}</td>
                        <td>${formatCurrency(row.importe)}</td>
                    </tr>
                `;
                total += row.importe;
            });

            // Renderizar totales discriminados por forma de pago
            data.totales.forEach(row => {
                totalPorForma.innerHTML += `
                    <p>${row.forma}: ${formatCurrency(row.total)}</p>
                `;
            });

            // Mostrar el total general
            totalRecaudacion.innerText = `Recaudación Diaria: ${formatCurrency(total)}`;
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
